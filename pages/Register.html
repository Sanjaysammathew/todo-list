<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskflow | Register</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
 <link rel="stylesheet" href="../style/register.css">
  <style>
    
  </style>
</head>

<body>

  <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">
    
    <!-- Header Section -->
    <div class="text-center mb-4">
      <div class="brand-logo mx-auto mb-2">
        <i class="bi bi-intersect"></i>
      </div>
      <span class="brand-title">Taskflow</span>
    </div>

    <!-- Register Card -->
    <div class="card register-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4">
          <h3 class="fw-bold mb-1">Create Account</h3>
          <p class="text-muted small">Please fill in your details to get started.</p>
        </div>

        <form>
          <!-- Username -->
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="userInput" placeholder="Username">
            <label for="userInput">Username</label>
          </div>

          <!-- Email -->
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
            <label for="emailInput">Email address</label>
          </div>

          <div class="row g-2">
            <!-- Password -->
            <div class="col-md-6 mb-3">
              <div class="form-floating">
                <input type="password" class="form-control" id="passInput" placeholder="Password">
                <label for="passInput" class="text-dark">Password</label>
              </div>
            </div>
            <!-- Confirm Password -->
            <div class="col-md-6 mb-3">
              <div class="form-floating">
                <input type="password" class="form-control" id="confirmInput" placeholder="Confirm">
                <label for="confirmInput">Confirm</label>
              </div>
            </div>
          </div>

           <div class="form-floating mb-3">
            <input type="number" class="form-control" id="num" placeholder="Number">
            <label for="num">Number</label>
          </div>

          <!-- Date -->
          <div class="form-floating mb-3">
            <input type="date" class="form-control" id="dateInput">
            <label for="dateInput">Birth Date</label>
          </div>

          <!-- Gender -->
          <div class="mb-4">
            <label class="form-label text-muted small d-block mb-2">Gender</label>
            <div class="d-flex gap-4">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="male" checked>
                <label class="form-check-label" for="male">Male</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="female">
                <label class="form-check-label" for="female">Female</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="other">
                <label class="form-check-label" for="other">Other</label>
              </div>
            </div>
          </div>
          <div class="form-floating mb-3">
  <select class="form-select " id="roleSelect" aria-label="Floating label select example">
    <option selected>Select role</option>
    <option value="1">Developer</option>
    <option value="2">Manager</option>
    <option value="3">Student</option>
  </select>
  <label for="roleSelect">Work Role</label>
</div>

    <div class="form-floating mb-3">
  <textarea 
    class="form-control" 
    id="addressInput" 
    placeholder="Address" 
    style="height: 100px"></textarea>
  <label for="addressInput">Address</label>
</div>

          <button type="submit" class="btn btn-teal w-100 shadow-sm">Register Now</button>
        </form>
      </div>
    </div>

    <p class="mt-4 text-muted small">Already have an account? <a href="#" class="text-teal text-decoration-none fw-bold" style="color: var(--accent-teal);">Log in</a></p>

  </div>

</body>
</html>
